<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restoran Sipariş Kontrolü</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ust-bant">
    <h1>Restoran Sipariş Kontrolü</h1>
  </header>

  <main class="paneller">
    <section class="panel" aria-labelledby="menu-baslik">
      <div class="panel-baslik">
        <h2 id="menu-baslik">Menü</h2>
        <button type="button" id="menu-duzenle-btn" class="btn btn-ikincil btn-kucuk" aria-expanded="false">Menüyü düzenle</button>
      </div>

      <div id="menu-yonetimi" class="menu-yonetimi" hidden>
        <form id="urun-ekle-formu" class="urun-ekle-formu" novalidate>
          <h3>Yeni ürün ekle</h3>
          <label>
            <span>Ürün adı <span class="zorunlu" aria-hidden="true">*</span></span>
            <input type="text" name="ad" autocomplete="off" placeholder="Örn. Izgara Köfte" required>
          </label>
          <div class="urun-form-ikili">
            <label>
              <span>Kategori <span class="zorunlu" aria-hidden="true">*</span></span>
              <input type="text" name="kategori" list="kategori-onerileri" autocomplete="off" placeholder="Örn. Ana Yemek" required>
              <datalist id="kategori-onerileri"></datalist>
            </label>
            <label>
              <span>Fiyat (₺) <span class="zorunlu" aria-hidden="true">*</span></span>
              <input type="number" name="fiyat" min="1" step="0.5" placeholder="250" required>
            </label>
          </div>
          <div class="urun-form-butonlar">
            <button type="submit" class="btn btn-ana">Ürün ekle</button>
            <button type="button" id="varsayilan-menu-btn" class="btn btn-ikincil btn-kucuk">Varsayılan menüyü yükle</button>
          </div>
          <p id="menu-mesaji" class="form-mesaji" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div id="menu"></div>
    </section>

    <section class="panel" aria-labelledby="sepet-baslik">
      <h2 id="sepet-baslik">Sepet</h2>
      <ul id="sepet-listesi" class="sepet-listesi"></ul>
      <div class="sepet-alt">
        <div id="ara-toplam-satiri" class="tutar-satiri" hidden>
          <span>Ara toplam</span>
          <span id="ara-toplam">0 ₺</span>
        </div>
        <div id="indirim-satiri" class="tutar-satiri indirim-satiri" hidden>
          <span id="indirim-etiketi">İndirim</span>
          <span id="indirim-tutari">0 ₺</span>
        </div>
        <div class="toplam-satiri">
          <span>Toplam</span>
          <strong id="sepet-toplam" aria-live="polite">0 ₺</strong>
        </div>

        <form id="kampanya-formu" class="kampanya-formu" novalidate>
          <label for="kampanya-kodu" class="gorunmez">Kampanya kodu</label>
          <input type="text" id="kampanya-kodu" name="kod" placeholder="Kampanya kodu" autocomplete="off">
          <button type="submit" class="btn btn-ikincil">Uygula</button>
          <button type="button" id="kampanya-kaldir" class="btn btn-ikincil" hidden>Kaldır</button>
        </form>
        <p id="kampanya-mesaji" class="form-mesaji" role="status" aria-live="polite"></p>

        <button type="button" id="sepeti-temizle" class="btn btn-ikincil">Sepeti temizle</button>
      </div>

      <form id="siparis-formu" class="siparis-formu" novalidate>
        <h3>Müşteri bilgileri</h3>
        <label>
          <span>Ad soyad <span class="zorunlu" aria-hidden="true">*</span></span>
          <input type="text" name="ad" autocomplete="off" required>
        </label>
        <label>
          <span>Telefon <span class="zorunlu" aria-hidden="true">*</span></span>
          <input type="tel" name="telefon" autocomplete="off" placeholder="0532 123 45 67" required>
        </label>
        <label>
          Adres
          <input type="text" name="adres" autocomplete="off">
        </label>
        <label>
          Not
          <textarea name="not" rows="2" placeholder="Örn. acısız olsun, zil çalışmıyor"></textarea>
        </label>
        <button type="submit" class="btn btn-ana">Siparişi kaydet</button>
        <p id="form-mesaji" class="form-mesaji" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="siparisler-baslik">
      <h2 id="siparisler-baslik">Bugünkü siparişler</h2>
      <div class="ozet">
        <div class="ozet-kutu">
          <span class="ozet-etiket">Sipariş sayısı</span>
          <strong id="siparis-sayisi">0</strong>
        </div>
        <div class="ozet-kutu">
          <span class="ozet-etiket">Ciro</span>
          <strong id="gunluk-ciro">0 ₺</strong>
        </div>
      </div>
      <ul id="siparis-listesi" class="siparis-listesi"></ul>
    </section>
  </main>

  <section id="fis-alani" class="fis-alani" aria-hidden="true"></section>

  <script src="js/cart.js"></script>
  <script src="js/discount.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
